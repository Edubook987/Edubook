<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../assets/js/theme.js"></script>
<title>EduBook &mdash; Recent Uploads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/details.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page">
  <header class="page-header">
    <a class="page-header__back" href="home.html" aria-label="Back to Home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
      <h1 class="page-header__title">Recent Uploads</h1>
      <p class="page-header__sub">Newest uploads first</p>
    </div>
  </header>

  <main class="page-content">
    <ul class="upload-list" id="uploads-list"></ul>
  </main>
</div>

<script src="../assets/js/books-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/view-details.js"></script>
<script>
  (function () {
    const books = Store.getRecentUploads();
    const listEl = document.getElementById('uploads-list');
    Render.list(listEl, books, 'No uploads yet. Be the first to upload a book.');
    // Add a relative-time line under each author line.
    books.forEach((b) => {
      const row = listEl.querySelector(`[data-book-id="${CSS.escape(b.id)}"] .upload-info`);
      if (row) {
        const t = document.createElement('p');
        t.className = 'upload-time';
        t.textContent = Render.timeAgo(b.uploadedAt);
        row.appendChild(t);
      }
    });
      ViewDetails.watch(document.getElementById('uploads-list'));
  })();
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
