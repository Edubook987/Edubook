<body class="home-body">

<div class="app">

  <!-- ============ Top bar ============ -->
  <header class="topbar">
    <button class="icon-btn" type="button" id="nd-menu-trigger" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="brand">
      <span class="brand__name">EduBook</span>
      <span class="brand__tag">Learn More, Spend Less</span>
    </div>

    <button class="icon-btn icon-btn--cart" type="button" id="home-cart-btn" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="badge" id="home-cart-badge" style="display:none;">0</span>
    </button>
  </header>

  <main class="content">

    <!-- ============ Hero ============ -->
    <section class="hero">
      <div class="hero__text">
        <h1>The Smart Way to<br>Buy &amp; Sell Textbooks</h1>
        <a class="btn-explore" href="explore.html">Explore Books</a>
      </div>
      <div class="hero__art" aria-hidden="true">
        <div class="hero__book hero__book--1"></div>
        <div class="hero__book hero__book--2"></div>
        <div class="hero__book hero__book--3"></div>
      </div>
    </section>

    <!-- ============ Search ============ -->
    <section class="search">
      <button type="button" class="search__icon" id="home-search-btn" aria-label="AI Smart Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 9.5 8.5 3 11l6.5 2.5L12 20l2.5-6.5L21 11l-6.5-2.5L12 2Z"/></svg>
      </button>
      <input type="search" id="home-search-input" placeholder="Ask AI or search by title, author, ISBN&hellip;" aria-label="Search books">
    </section>

    <!-- ============ Quick actions ============ -->
    <section class="quick-actions">
      <button class="quick-action" type="button" data-href="buy.html">
        <span class="quick-action__icon quick-action__icon--buy">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 8H6"/></svg>
        </span>
        <span>Buy Books</span>
      </button>
      <button class="quick-action" type="button" data-href="sell.html">
        <span class="quick-action__icon quick-action__icon--sell">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L3 3v6.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.58Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        </span>
        <span>Sell Books</span>
      </button>
      <button class="quick-action" type="button" data-href="upload.html">
        <span class="quick-action__icon quick-action__icon--upload">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        <span>Upload Book</span>
      </button>
      <button class="quick-action" type="button" data-href="wishlist.html">
        <span class="quick-action__icon quick-action__icon--wishlist">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
        </span>
        <span>Wishlist</span>
      </button>
      <button class="quick-action" type="button" data-href="offers.html">
        <span class="quick-action__icon quick-action__icon--offers">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/></svg>
        </span>
        <span>Offers</span>
      </button>
    </section>

    <!-- ============ Trending Books ============ -->
    <section class="section">
      <div class="section__head">
        <h2>Trending Books</h2>
        <a href="trending.html" class="see-all">See All</a>
      </div>
      <div class="trending-row" id="trending-row"></div>
    </section>

    <!-- ============ Recent Uploads ============ -->
    <section class="section">
      <div class="section__head">
        <h2>Recent Uploads</h2>
        <a href="uploads.html" class="see-all">See All</a>
      </div>
      <ul class="upload-list upload-list--horizontal" id="recent-uploads-list"></ul>
    </section>

    <!-- ============ For You (AI recommendations) ============ -->
    <section class="section" id="for-you-section" style="display:none;">
      <div class="section__head">
        <h2>For You <span class="ai-badge" style="vertical-align:middle;">AI</span></h2>
        <a href="search.html" class="see-all">Smart Search</a>
      </div>
      <div class="books-grid" id="for-you-grid"></div>
    </section>

    <!-- ============ Why EduBook ============ -->
    <section class="why">
      <h2 class="why__title">Why EduBook?</h2>
      <div class="why__grid">
        <div class="why__item">
          <span class="why__icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 15 14"/></svg>
          </span>
          <span>Affordable<br>Prices</span>
        </div>
        <div class="why__item">
          <span class="why__icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span>Verified<br>Sellers</span>
        </div>
        <div class="why__item">
          <span class="why__icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
          </span>
          <span>Quality<br>Books</span>
        </div>
        <div class="why__item why__item--badge">
          <span class="why__icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="why__dot"></span>
          </span>
          <span>Easy<br>Interface</span>
        </div>
      </div>
    </section>

  </main>

  <!-- ============ Bottom nav ============ -->
  <nav class="bottom-nav">
    <button class="nav-item is-active" type="button" data-href="home.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" type="button" data-href="search.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="nav-item" type="button" data-href="sell.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>Sell</span>
    </button>
    <button class="nav-item" type="button" data-href="buy.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4Z"/><path d="M12 22V12"/><path d="m4 7 8 5 8-5"/></svg>
      <span>Orders</span>
    </button>
    <button class="nav-item" type="button" data-href="profile.html">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </button>
  </nav>

</div>

<script src="../assets/js/books-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/home.js"></script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/profile-store.js"></script>
<script src="../assets/js/view-details.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script>
  (function () {
    // ---- View Details buttons on Trending / Recent Uploads (home.js renders these) ----
    ViewDetails.watch(document.getElementById('trending-row'));
    ViewDetails.watch(document.getElementById('recent-uploads-list'));

    // ---- Live cart badge ----
    function updateCartBadge() {
      try {
        var count = ProfileStore.getCart().reduce(function (s, l) { return s + l.qty; }, 0);
        var badge = document.getElementById('home-cart-badge');
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
        document.getElementById('home-cart-btn').setAttribute('aria-label', 'Cart, ' + count + ' item' + (count === 1 ? '' : 's'));
      } catch (e) {}
    }
    updateCartBadge();
    document.getElementById('home-cart-btn').addEventListener('click', function () {
      window.location.href = 'cart.html';
    });
    window.addEventListener('storage', function (e) {
      if (e.key === 'edubook_profile_v1') updateCartBadge();
    });
  })();
</script>
<script>
  (function () {
    function allBooks() {
      if (typeof Store !== 'undefined' && Store.getAllBooks) return Store.getAllBooks();
      var sets = [];
      if (typeof CATALOG_BOOKS !== 'undefined') sets.push(CATALOG_BOOKS);
      if (typeof SELL_BOOKS !== 'undefined') sets.push(SELL_BOOKS);
      if (typeof UPLOAD_BOOKS !== 'undefined') sets.push(UPLOAD_BOOKS);
      return [].concat.apply([], sets);
    }
    try {
      var wishlistIds = (typeof Store !== 'undefined' && Store.getWishlist) ? Store.getWishlist() : [];
      var recos = AIEngine.getRecommendations(allBooks(), { wishlistIds: wishlistIds, limit: 6 });
      if (recos.length && typeof Render !== 'undefined') {
        document.getElementById('for-you-section').style.display = 'block';
        Render.grid(document.getElementById('for-you-grid'), recos);
        ViewDetails.watch(document.getElementById('for-you-grid'));
      }
    } catch (e) {}
  })();
</script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
