<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../assets/js/theme.js"></script>
<title>EduBook &mdash; Buy Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/details.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page">
  <header class="page-header">
    <a class="page-header__back" href="home.html" aria-label="Back to Home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
      <h1 class="page-header__title">Buy Books</h1>
      <p class="page-header__sub">Higher-education textbooks available for purchase</p>
    </div>
  </header>

  <main class="page-content">
    <div class="chip-row" id="category-chips"></div>
    <div class="books-grid" id="buy-grid"></div>
  </main>
</div>

<script src="../assets/js/books-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/view-details.js"></script>
<script>
  (function () {
    const books = CATALOG_BOOKS;
    const grid = document.getElementById('buy-grid');
    const chipRow = document.getElementById('category-chips');
    const categories = ['All'].concat(Array.from(new Set(books.map((b) => b.category))));

    function renderChips(active) {
      chipRow.innerHTML = categories.map((c) =>
        `<button type="button" class="chip${c === active ? ' is-active' : ''}" data-cat="${Render.esc(c)}">${Render.esc(c)}</button>`
      ).join('');
      chipRow.querySelectorAll('.chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          renderChips(btn.dataset.cat);
          const filtered = btn.dataset.cat === 'All' ? books : books.filter((b) => b.category === btn.dataset.cat);
          Render.grid(grid, filtered, 'No books in this category yet.');
        });
      });
    }

    renderChips('All');
    Render.grid(grid, books, 'No books available right now.');
      ViewDetails.watch(document.getElementById('buy-grid'));
  })();
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
