<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduBook &mdash; Contact Us</title>
<script src="../assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page pc-page">
  <header class="page-header">
    <a class="page-header__back" href="profile.html" aria-label="Back to Profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="page-header__title">Contact Us</h1>
  </header>

  <main class="page-content">
    <div class="pc-card">
      <ul class="pc-list">
        <li><a class="pc-row" href="mailto:support@edubook.app">
          <span class="pc-row__icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span>
          <span class="pc-row__body">
            <span class="pc-row__label">Email support</span>
            <span class="pc-row__sub">support@edubook.app</span>
          </span>
        </a></li>
        <li><a class="pc-row" href="tel:+911234567890">
          <span class="pc-row__icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <span class="pc-row__body">
            <span class="pc-row__label">Call support</span>
            <span class="pc-row__sub">+91 12345 67890 (9am&ndash;7pm, Mon&ndash;Sat)</span>
          </span>
        </a></li>
      </ul>
    </div>

    <div class="pc-section">
      <p class="pc-section__title">Send a message</p>
      <div class="pc-card" style="padding:20px;">
        <form id="contact-form" novalidate>
          <div class="field"><label for="c-subject">Subject</label><input type="text" id="c-subject" required></div>
          <div class="field"><label for="c-message">Message</label><textarea id="c-message" rows="4" required></textarea></div>
          <div class="pc-status" id="c-status"></div>
          <button type="submit" class="btn btn--primary">Send Message</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var subject = document.getElementById('c-subject').value.trim();
    var message = document.getElementById('c-message').value.trim();
    var statusEl = document.getElementById('c-status');
    if (!subject || !message) {
      statusEl.textContent = 'Please fill in both fields.';
      statusEl.className = 'pc-status pc-status--error';
      return;
    }
    // No dedicated backend endpoint yet — falls back to opening the user's mail client.
    var body = encodeURIComponent(message);
    window.location.href = 'mailto:support@edubook.app?subject=' + encodeURIComponent(subject) + '&body=' + body;
    statusEl.textContent = 'Opening your email app\u2026';
    statusEl.className = 'pc-status pc-status--ok';
  });
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
