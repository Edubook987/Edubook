<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../assets/js/theme.js"></script>
<title>EduBook &mdash; Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/details.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page">
  <header class="page-header">
    <a class="page-header__back" href="home.html" aria-label="Back to Home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
      <h1 class="page-header__title">Wishlist</h1>
      <p class="page-header__sub" id="wishlist-count"></p>
    </div>
  </header>

  <main class="page-content">
    <div class="books-grid" id="wishlist-grid"></div>
  </main>
</div>

<script src="../assets/js/books-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/view-details.js"></script>
<script>
  (function () {
    function load() {
      const ids = Store.getWishlist();
      const books = ids.map((id) => Store.findBookById(id)).filter(Boolean);
      document.getElementById('wishlist-count').textContent =
        books.length ? `${books.length} saved book${books.length === 1 ? '' : 's'}` : '';
      const grid = document.getElementById('wishlist-grid');
      Render.grid(grid, books, 'Your wishlist is empty. Tap the heart on any book to save it here.');
      // Re-render if a heart is un-toggled from this page, so it disappears immediately.
      grid.querySelectorAll('.heart-btn').forEach((btn) => {
        btn.addEventListener('click', () => setTimeout(load, 0));
      });
    }
    load();
      ViewDetails.watch(document.getElementById('wishlist-grid'));
  })();
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
