<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduBook &mdash; Account Settings</title>
<script src="../assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page pc-page">
  <header class="page-header">
    <a class="page-header__back" href="profile.html" aria-label="Back to Profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="page-header__title">Account Settings</h1>
  </header>

  <main class="page-content">
    <div class="pc-section">
      <p class="pc-section__title">Account info</p>
      <div class="pc-card" style="padding:16px 20px;">
        <div class="field"><label>Full Name</label><p id="as-name" style="margin:0;">&mdash;</p></div>
        <div class="field" style="margin-bottom:0;"><label>Email Address</label><p id="as-email" style="margin:0;">&mdash;</p></div>
      </div>
      <a class="btn--ghost" href="edit-profile.html">Edit Profile Info</a>
    </div>

    <div class="pc-section">
      <p class="pc-section__title">Preferences</p>
      <div class="pc-card">
        <ul class="pc-list">
          <li><a class="pc-row" href="notifications.html">
            <span class="pc-row__body"><span class="pc-row__label">Notifications</span></span>
            <svg class="pc-row__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a></li>
          <li><a class="pc-row" href="appearance.html">
            <span class="pc-row__body"><span class="pc-row__label">Dark Mode</span></span>
            <svg class="pc-row__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a></li>
          <li><a class="pc-row" href="language.html">
            <span class="pc-row__body"><span class="pc-row__label">Language</span></span>
            <svg class="pc-row__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a></li>
        </ul>
      </div>
    </div>

    <div class="pc-section">
      <p class="pc-section__title">Security</p>
      <div class="pc-card">
        <ul class="pc-list">
          <li><a class="pc-row" href="change-password.html">
            <span class="pc-row__body"><span class="pc-row__label">Change Password</span></span>
            <svg class="pc-row__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a></li>
          <li><a class="pc-row" href="privacy-security.html">
            <span class="pc-row__body"><span class="pc-row__label">Privacy &amp; Security</span></span>
            <svg class="pc-row__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a></li>
          <li><a class="pc-row pc-row--danger" href="profile.html#delete">
            <span class="pc-row__icon pc-row__icon--danger"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
            <span class="pc-row__body"><span class="pc-row__label">Delete My Account</span></span>
          </a></li>
        </ul>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/profile-store.js"></script>
<script>
  (function () {
    var p = ProfileStore.getProfile();
    document.getElementById('as-name').textContent = p.fullName || 'Not set';
    document.getElementById('as-email').textContent = p.email || 'Not set';
  })();
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
