<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduBook &mdash; Change Password</title>
<script src="../assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/home.css">
<link rel="stylesheet" href="../assets/css/books.css">
<link rel="stylesheet" href="../assets/css/profile.css">
<link rel="stylesheet" href="../assets/css/ai.css">
<link rel="stylesheet" href="../assets/css/nav-drawer.css">
</head>
<body class="home-body">

<div class="page pc-page">
  <header class="page-header">
    <a class="page-header__back" href="profile.html" aria-label="Back to Profile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="page-header__title">Change Password</h1>
  </header>

  <main class="page-content">
    <div class="pc-card" style="padding:20px;">
      <form id="cp-form" novalidate>
        <div class="field">
          <label for="cp-current">Current Password</label>
          <input type="password" id="cp-current" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="cp-new">New Password</label>
          <input type="password" id="cp-new" autocomplete="new-password" minlength="8" required>
          <span class="field__hint" style="font-size:0.78rem; color:var(--pc-muted);">At least 8 characters, with a letter and a number.</span>
        </div>
        <div class="field">
          <label for="cp-confirm">Confirm New Password</label>
          <input type="password" id="cp-confirm" autocomplete="new-password" required>
        </div>
        <div class="pc-status" id="cp-status"></div>
        <button type="submit" class="btn btn--primary">Update Password</button>
      </form>
    </div>
    <p class="pc-prose" style="color:var(--pc-muted); font-size:0.82rem;">
      Forgot your current password instead? Sign out and use <strong>Forgot password?</strong> on the sign-in screen.
    </p>
  </main>
</div>

<script>
  (function () {
    var form = document.getElementById('cp-form');
    var statusEl = document.getElementById('cp-status');

    function passwordOk(pw) { return pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw); }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var current = document.getElementById('cp-current').value;
      var next = document.getElementById('cp-new').value;
      var confirm = document.getElementById('cp-confirm').value;

      if (!current) { statusEl.textContent = 'Enter your current password.'; statusEl.className = 'pc-status pc-status--error'; return; }
      if (!passwordOk(next)) { statusEl.textContent = 'New password needs 8+ characters with a letter and a number.'; statusEl.className = 'pc-status pc-status--error'; return; }
      if (next !== confirm) { statusEl.textContent = 'Passwords do not match.'; statusEl.className = 'pc-status pc-status--error'; return; }

      statusEl.textContent = 'Updating\u2026';
      statusEl.className = 'pc-status';
      try {
        var res = await fetch('../php/change_password.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: current, newPassword: next })
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok && data.success) {
          statusEl.textContent = 'Password updated.';
          statusEl.className = 'pc-status pc-status--ok';
          form.reset();
        } else {
          statusEl.textContent = data.message || 'Could not update password. Check your current password and try again.';
          statusEl.className = 'pc-status pc-status--error';
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
        statusEl.className = 'pc-status pc-status--error';
      }
    });
  })();
</script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/ai-chat-widget.js"></script>
<script src="../assets/js/nav-drawer.js"></script>
</body>
</html>
